{% extends "base.html" %}

{% block title %}Login | GUDLFT Registration{% endblock %}

{% block content %}
    <h1>Welcome to the GUDLFT Registration Portal!</h1>
    <p>Please enter your secretary email to continue:</p>
    <form action="{{ url_for('show_summary') }}" method="post">
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="your.email@example.com" required>
        <button type="submit">Enter</button>
    </form>
    <hr>
    <a href="{{ url_for('points_dashboard') }}">View Club Points Leaderboard</a>
{% endblock %}
