<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GUDLFT Registration{% endblock %}</title>
    <!-- Cette ligne est cruciale : elle lie le CSS à toutes les pages -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Bloc pour afficher les messages d'erreur/succès -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="flashes">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <!-- Le contenu spécifique de chaque page sera inséré ici -->
        {% block content %}{% endblock %}
    </div>
</body>
</html>
